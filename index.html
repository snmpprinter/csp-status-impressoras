const ITER  = 250000;

function b64d(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function tryDecrypt() {
  const pwd = document.getElementById("pwd").value;
  const errEl = document.getElementById("err");
  errEl.textContent = "";
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(pwd), {name: "PBKDF2"}, false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name: "PBKDF2", salt: b64d(SALT), iterations: ITER, hash: "SHA-256"},
      keyMaterial, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    const plainBuf = await crypto.subtle.decrypt(
      {name: "AES-GCM", iv: b64d(NONCE)}, key, b64d(CT));
    const html = new TextDecoder().decode(plainBuf);
    document.open(); document.write(html); document.close();
  } catch (e) {
    errEl.textContent = "Senha incorreta.";
  }
}
document.getElementById("pwd").addEventListener("keyup", e => {
  if (e.key === "Enter") tryDecrypt();
});
