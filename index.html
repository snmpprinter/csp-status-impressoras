  <title>Painel de Impressoras</title>

  <!-- O Script deve vir AQUI, dentro do <head> -->
  <script>
    (function() {
      // A senha criada é visitor02
      var senhaCorreta = "visitor02"; 

      var digitada = prompt("Digite a senha para visualizar o status das impressoras:");
      if (digitada !== senhaCorreta) {
        alert("Senha incorreta! Acesso negado.");
        document.write("<div style='text-align:center; margin-top:50px; font-family:sans-serif;'><h2>Acesso Não Autorizado</h2></div>");
        window.stop();
      }
    })();
  </script>
</head>
